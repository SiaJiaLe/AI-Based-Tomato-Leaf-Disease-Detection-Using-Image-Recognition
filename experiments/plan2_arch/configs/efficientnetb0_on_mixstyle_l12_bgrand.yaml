# COMBINATION row — Plan 2 Tier 3 (MixStyle) + Plan 1 (background randomization).
#
# This is NOT a tier row and is NOT attributable to either factor alone. It is
# the fourth cell of a 2x2 factorial and is interpretable only against BOTH
# single-factor rows:
#
#   efficientnetb0_on                 neither          (baseline)
#   efficientnetb0_on_bgrand          bgrand only      (-0.0312 real-world macro-F1)
#   efficientnetb0_on_mixstyle_l12    mixstyle only
#   efficientnetb0_on_mixstyle_l12_bgrand   both       (this row)
#
# Rationale for combining THESE two specifically: background randomization
# perturbs style in INPUT space (it swaps real pixels behind the leaf), MixStyle
# perturbs it in FEATURE space (it mixes internal channel statistics). They
# attack the same lab->field style gap at different levels, so they are the one
# pairing with a mechanistic reason to compose rather than merely co-occur.
#
# The background_randomization block below is IDENTICAL to
# experiments/plan1_bgrand/configs/efficientnetb0_on_bgrand.yaml — same synthetic
# pool, same prob, same segmentation. If it differed, the factorial would break
# and "bgrand's marginal effect" would be uncomputable.
run_name: efficientnetb0_on_mixstyle_l12_bgrand
seed: 42
backbone: efficientnetb0
data_dir: data/processed
real_world_dir: data/real_environment_dataset
combination: true            # REQUIRED opt-in; run_arch.py refuses to bundle Plan 1 without it
stack:                       # still IDENTICAL to the baseline
  advanced_augmentation: true
  label_smoothing: 0.1
  strong_head: true
  cbam: true
  stage_b: two_group
architecture_mod:            # factor A — feature-space style mixing
  mixstyle:
    layers: [1, 2]
    p: 0.5
    alpha: 0.1
background_randomization:    # factor B — input-space background swap (train set only)
  enabled: true
  prob: 0.5
  background_dir: data/backgrounds_generic_synthetic
  segmentation: pretrained
  mask_erode_px: 3
  mask_cache_dir: data/mask_cache
  boundary_blur: true
training:                    # IDENTICAL budget
  stage_a_epochs: 15
  stage_b_epochs: 25
  patience: 7
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  batch_size: 32
