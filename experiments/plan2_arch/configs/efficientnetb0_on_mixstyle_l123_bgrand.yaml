# COMBINATION row — Plan 2 Tier 3 (MixStyle, layers 1-3) + Plan 1 (background
# randomization). Sibling of efficientnetb0_on_mixstyle_l12_bgrand; only the
# MixStyle insertion depth differs, matching its own tier row.
#
# Only ONE of the two *_bgrand configs is ever run: the one whose MixStyle depth
# won the val sweep. Both exist so the SLURM script can select by name without
# generating YAML at runtime.
#
# NOT attributable to either factor alone — see the l12_bgrand config header for
# the 2x2 factorial this row completes.
run_name: efficientnetb0_on_mixstyle_l123_bgrand
seed: 42
backbone: efficientnetb0
data_dir: data/processed
real_world_dir: data/real_environment_dataset
combination: true            # REQUIRED opt-in; run_arch.py refuses to bundle Plan 1 without it
stack:                       # still IDENTICAL to the baseline
  advanced_augmentation: true
  label_smoothing: 0.1
  strong_head: true
  cbam: true
  stage_b: two_group
architecture_mod:            # factor A — feature-space style mixing
  mixstyle:
    layers: [1, 2, 3]
    p: 0.5
    alpha: 0.1
background_randomization:    # factor B — input-space background swap (train set only)
  enabled: true
  prob: 0.5
  background_dir: data/backgrounds_generic_synthetic
  segmentation: pretrained
  mask_erode_px: 3
  mask_cache_dir: data/mask_cache
  boundary_blur: true
training:                    # IDENTICAL budget
  stage_a_epochs: 15
  stage_b_epochs: 25
  patience: 7
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  batch_size: 32
