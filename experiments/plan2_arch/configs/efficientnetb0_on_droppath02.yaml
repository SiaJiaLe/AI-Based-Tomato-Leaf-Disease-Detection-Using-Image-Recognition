# Plan 2 Tier 1 — EfficientNetB0 + stochastic depth (drop-path), rate 0.2.
# Standalone row: the efficientnetb0_on baseline plus drop-path, nothing else.
# No background randomization (Plan 1 was a bounded negative), no Tier 2/3.
run_name: efficientnetb0_on_droppath02
seed: 42
backbone: efficientnetb0
data_dir: data/processed
real_world_dir: data/real_environment_dataset
stack:                       # IDENTICAL to experiments/configs/efficientnetb0_on.yaml
  advanced_augmentation: true
  label_smoothing: 0.1
  strong_head: true          # already contains Dropout(0.4)+Dropout(0.3)
  cbam: true
  stage_b: two_group
architecture_mod:            # the ONE variable this row tests
  drop_path_rate: 0.2
training:                    # IDENTICAL budget
  stage_a_epochs: 15
  stage_b_epochs: 25
  patience: 7
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  batch_size: 32
