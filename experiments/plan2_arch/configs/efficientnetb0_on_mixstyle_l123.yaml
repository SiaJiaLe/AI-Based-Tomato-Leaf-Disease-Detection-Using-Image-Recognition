# Plan 2 Tier 3 — EfficientNetB0 + MixStyle after the first THREE MBConv stages.
# Sweep sibling of efficientnetb0_on_mixstyle_l12: identical in every respect
# except the insertion depth, which is MixStyle's main knob. The winner is chosen
# on PlantVillage VAL macro-F1 (select_on_val.py) — never on real-world.
#
# Deeper insertion mixes more of the network's style, but late layers carry
# semantics rather than style, so going deeper can start destroying content.
# Stage 3 is the reasonable edge of that trade-off.
run_name: efficientnetb0_on_mixstyle_l123
seed: 42
backbone: efficientnetb0
data_dir: data/processed
real_world_dir: data/real_environment_dataset
stack:                       # IDENTICAL to experiments/configs/efficientnetb0_on.yaml
  advanced_augmentation: true
  label_smoothing: 0.1
  strong_head: true
  cbam: true
  stage_b: two_group
architecture_mod:            # the ONE variable this row tests
  mixstyle:
    layers: [1, 2, 3]
    p: 0.5
    alpha: 0.1
training:                    # IDENTICAL budget
  stage_a_epochs: 15
  stage_b_epochs: 25
  patience: 7
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  batch_size: 32
