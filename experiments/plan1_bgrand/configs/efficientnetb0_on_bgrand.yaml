# Plan 1 — EfficientNetB0 Stack-ON + background randomization.
# IDENTICAL to experiments/configs/efficientnetb0_on.yaml except the one new
# `background_randomization` block. Same backbone, seed, split, budget, and
# full solution stack — so any delta is attributable to background randomization
# alone.
run_name: efficientnetb0_on_bgrand
seed: 42
backbone: efficientnetb0
data_dir: data/processed
real_world_dir: data/processed/real_environment_test
stack:                              # unchanged from efficientnetb0_on
  advanced_augmentation: true
  label_smoothing: 0.1
  strong_head: true
  cbam: true
  stage_b: two_group
background_randomization:           # the ONE new variable (train-set only)
  enabled: true
  prob: 0.5                         # fraction of train images randomized; tune on VAL only
  background_dir: data/backgrounds_generic   # generic textures, NOT PlantVillage, NOT real-world
  segmentation: pretrained          # rembg / U^2-Net — robust on textured backdrops (was hsv_threshold)
  mask_erode_px: 3                  # shrink mask inward to remove the original-background halo
  boundary_blur: true
training:                           # unchanged budget
  stage_a_epochs: 15
  stage_b_epochs: 25
  patience: 7
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  batch_size: 32
