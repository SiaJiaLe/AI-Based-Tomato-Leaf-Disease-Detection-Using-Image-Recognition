# Plan 1 — EfficientNetB0 Stack-ON + background randomization, REAL CC0 backdrops.
# Identical to efficientnetb0_on_bgrand.yaml except background_dir points at real
# photos (data/backgrounds_generic_real) and a distinct run_name so the synthetic-backdrop
# result (efficientnetb0_on_bgrand) is preserved for the synthetic-vs-real comparison.
run_name: efficientnetb0_on_bgrand_real
seed: 42
backbone: efficientnetb0
data_dir: data/processed
real_world_dir: data/real_environment_dataset
stack:                              # unchanged from efficientnetb0_on
  advanced_augmentation: true
  label_smoothing: 0.1
  strong_head: true
  cbam: true
  stage_b: two_group
background_randomization:
  enabled: true
  prob: 0.5
  background_dir: data/backgrounds_generic_real   # REAL CC0 field/texture photos (NOT PlantVillage, NOT real-world test)
  segmentation: pretrained
  mask_erode_px: 3
  mask_cache_dir: data/mask_cache           # SAME cache as the synthetic run — masks are keyed by leaf image, so reused
  boundary_blur: true
training:                           # unchanged budget
  stage_a_epochs: 15
  stage_b_epochs: 25
  patience: 7
  stage_a_lr: 1.0e-3
  stage_b_lr: 1.0e-4
  batch_size: 32
