# Single-service deployment for the on-device tomato leaf scanner PWA.
# Build stage compiles the Vite app; nginx serves the static bundle with the
# cross-origin-isolation headers the app needs. Inference still runs entirely
# in the visitor's browser — the container only serves static files.
services:
  scanner:
    build: ./mobile-scanner
    container_name: leaf-scanner
    ports:
      - "8080:80"        # http://localhost:8080  (localhost = secure context, camera works)
    restart: unless-stopped
