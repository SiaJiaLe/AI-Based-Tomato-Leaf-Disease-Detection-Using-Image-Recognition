server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation: required for
    # performance.measureUserAgentSpecificMemory() (the §1.1 peak-memory metric)
    # and for onnxruntime-web multi-threaded WASM. Applied at server scope so
    # every response (html, js, wasm, onnx) carries them. Nothing third-party is
    # loaded, so require-corp is safe.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # nginx:alpine mime.types already maps .wasm -> application/wasm, but NOT
    # .mjs. onnxruntime-web loads its WASM glue as an ES module (.jsep.mjs);
    # served as octet-stream the browser refuses to execute it, so force the
    # correct JS MIME. (This location has no add_header, so the server-scope
    # COOP/COEP/CORP headers above are still inherited.)
    location ~ \.mjs$ {
        default_type text/javascript;
        # Adding add_header here drops the inherited server-scope headers, so
        # repeat the isolation ones. no-store stops the browser reusing a stale
        # cached copy with the wrong (octet-stream) MIME via a 304.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback so client-side routing / direct refresh works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
